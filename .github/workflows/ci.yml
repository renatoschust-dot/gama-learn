name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          python -m py_compile server.py sentinel.py skillfix.py bench20.py bench_hard.py sentinel_fleet.py artifacts.py mcp_server.py
      - name: No internal addresses committed
        run: python3 tools_no_internal_addrs.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
