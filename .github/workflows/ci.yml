name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          python -m py_compile server.py sentinel.py skillfix.py bench20.py bench_hard.py sentinel_fleet.py artifacts.py mcp_server.py
      - name: No internal addresses committed
        run: python3 tools_no_internal_addrs.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
