name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          python -m py_compile server.py sentinel.py skillfix.py bench20.py bench_hard.py sentinel_fleet.py artifacts.py mcp_server.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
